[project]
name = "pm"
version = "0.1.0"
description = "Local-only project management MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "itsdangerous>=2.2.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
